name: Upstream Sync

# 将 cmliu/edgetunnel/main 同步到本仓库 main。
# 不创建任何远程临时分支，不强制覆盖 main。
# 无冲突：自动合并并推送。
# 有冲突：停止并保留远程 main。
# 特别检查 _worker.js：先做无副作用的三方合并预检。

permissions:
  contents: write

on:
  schedule:
    # 每天 00:00 UTC = 北京/台北时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync cmliu/edgetunnel -> main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin and upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Verify main has not changed during checkout
        run: |
          set -euo pipefail
          LOCAL_MAIN="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          echo "本次运行基准 main: ${LOCAL_MAIN}"
          echo "当前 origin/main:   ${REMOTE_MAIN}"
          if [ "${LOCAL_MAIN}" != "${REMOTE_MAIN}" ]; then
            echo "检测到 main 在工作流启动期间发生变化。"
            echo "为避免覆盖用户提交，本次同步停止，不推送。"
            exit 1
          fi

      - name: Check upstream status
        id: check
        run: |
          set -euo pipefail
          LOCAL_MAIN="$(git rev-parse HEAD)"
          UPSTREAM_MAIN="$(git rev-parse upstream/main)"
          echo "local main:    ${LOCAL_MAIN}"
          echo "upstream main: ${UPSTREAM_MAIN}"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "当前 main 已包含上游最新提交，无需同步。"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "检测到上游存在新提交。"
            echo "上游相对本地新增提交数: $(git rev-list --count HEAD..upstream/main)"
          fi

      - name: Preflight _worker.js conflict check
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail

          echo "========================================"
          echo "检查 _worker.js 是否存在合并冲突"
          echo "========================================"

          BASE="$(git merge-base HEAD upstream/main)"
          echo "共同基线: ${BASE}"

          LOCAL_CHANGED="false"
          UPSTREAM_CHANGED="false"

          if ! git diff --quiet "${BASE}" HEAD -- _worker.js; then
            LOCAL_CHANGED="true"
          fi
          if ! git diff --quiet "${BASE}" upstream/main -- _worker.js; then
            UPSTREAM_CHANGED="true"
          fi

          echo "本地 _worker.js 是否修改: ${LOCAL_CHANGED}"
          echo "上游 _worker.js 是否修改: ${UPSTREAM_CHANGED}"

          # 使用 Git 原生三方合并预检，不修改工作区、不创建提交。
          # --write-tree 成功 = 可以自动合并；失败 = 存在真实冲突。
          MERGE_TREE_OUTPUT="$(git merge-tree --write-tree HEAD upstream/main 2>&1)" || MERGE_TREE_STATUS=$?
          MERGE_TREE_STATUS="${MERGE_TREE_STATUS:-0}"

          if [ "${MERGE_TREE_STATUS}" -ne 0 ]; then
            echo "Git 检测到合并冲突。"
            echo "${MERGE_TREE_OUTPUT}"

            if printf '%s\n' "${MERGE_TREE_OUTPUT}" | grep -Eq '(^|[ /])_worker\.js($|[ :])'; then
              echo ""
              echo "[重点] _worker.js 存在真实合并冲突。"
              echo "禁止自动选择 ours/theirs，禁止覆盖你的修改。"
            else
              echo "[重点] _worker.js 本身没有被 Git 标记为冲突；冲突发生在其他文件。"
            fi

            exit 1
          fi

          if [ "${LOCAL_CHANGED}" = "true" ] && [ "${UPSTREAM_CHANGED}" = "true" ]; then
            echo "[信息] _worker.js 在本地和上游都发生过修改，但 Git 三方合并没有发现文本冲突。"
            echo "将继续使用 Git 自动合并结果，不擅自覆盖任一方。"
          elif [ "${UPSTREAM_CHANGED}" = "true" ]; then
            echo "[信息] 仅上游修改了 _worker.js，可安全继承上游更新。"
          elif [ "${LOCAL_CHANGED}" = "true" ]; then
            echo "[信息] 仅本地修改了 _worker.js，将保留本地修改。"
          else
            echo "[信息] _worker.js 未发生变化。"
          fi

          echo "_worker.js 冲突预检通过。"

      - name: Merge upstream into main
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          echo "开始合并 cmliu/edgetunnel/main -> main"

          if git merge --no-edit --no-ff upstream/main; then
            echo "上游更新已成功合并。"
          else
            echo "上游同步发生真实 Git 冲突。"
            echo "不会推送冲突状态。"
            echo "现有远程 main 保持不变。"
            git diff --name-only --diff-filter=U || true
            git merge --abort || true
            exit 1
          fi

      - name: Validate merge result
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          echo "检查 Git 工作区..."
          if [ -n "$(git status --porcelain)" ]; then
            git diff --check
          fi
          if git diff --name-only HEAD^ HEAD | grep -Eq '(^|/)_worker\.js$'; then
            echo "检测到 _worker.js 发生变化，执行 Node 语法检查。"
            node --check _worker.js
          fi
          echo "合并结果验证通过。"

      - name: Final safety check before push
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          git fetch --prune origin main
          BASE_BEFORE_MERGE="$(git rev-parse HEAD^1)"
          CURRENT_ORIGIN="$(git rev-parse origin/main)"
          echo "合并前 main 基准: ${BASE_BEFORE_MERGE}"
          echo "当前 origin/main:  ${CURRENT_ORIGIN}"
          if [ "${BASE_BEFORE_MERGE}" != "${CURRENT_ORIGIN}" ]; then
            echo "main 在合并期间发生变化。"
            echo "为避免覆盖新提交，本次同步停止，不推送。"
            exit 1
          fi
          if git ls-files -u | grep -q .; then
            echo "仍存在未解决冲突，禁止推送。"
            exit 1
          fi

      - name: Push main
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "同步完成：CM-JieDian/main 已更新。"
