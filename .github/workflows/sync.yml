name: Upstream Sync

# 将 cmliu/edgetunnel/main 同步到本仓库 main。
# 不 force push，不覆盖并行提交。
#
# _worker.js 策略：
#   永远以上游版本为底，再运行 scripts/overlay-local-worker.js
#   把本地功能（逗号多 IP 随机抽取）叠回去。
#   禁止让 Git 对这个文件做行级自动混合。
# 其他文件：正常三方合并；有冲突则整次停止、不推送。

permissions:
  contents: write

on:
  schedule:
    # 每天 00:00 UTC = 北京/台北时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync cmliu/edgetunnel -> main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Configure Git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git config core.eol lf

      - name: Fetch origin and upstream
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Verify main has not changed during checkout
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          echo "本次运行基准 main: ${BASE_SHA}"
          echo "当前 origin/main:   ${REMOTE_MAIN}"
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"

          if [ "${BASE_SHA}" != "${REMOTE_MAIN}" ]; then
            echo "检测到 main 在工作流启动期间发生变化，停止以免覆盖用户提交。"
            exit 1
          fi

      - name: Check upstream status
        id: check
        run: |
          set -euo pipefail
          echo "local main:    $(git rev-parse HEAD)"
          echo "upstream main: $(git rev-parse upstream/main)"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "当前 main 已包含上游最新提交，无需同步。"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "检测到上游存在新提交。"
            echo "上游相对本地新增提交数: $(git rev-list --count HEAD..upstream/main)"
          fi

      - name: Merge upstream then overlay local _worker.js
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail

          if [ ! -f scripts/overlay-local-worker.js ]; then
            echo "::error::缺少 scripts/overlay-local-worker.js，拒绝同步以免丢掉本地功能。"
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff --no-edit upstream/main
          MERGE_STATUS=$?
          set -e

          if [ "${MERGE_STATUS}" -ne 0 ]; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U || true)
            if [ "${#CONFLICTS[@]}" -eq 0 ]; then
              echo "git merge 失败且没有冲突文件，停止。"
              git merge --abort || true
              exit 1
            fi

            OTHER=()
            for f in "${CONFLICTS[@]}"; do
              case "${f}" in
                _worker.js|*/_worker.js) ;;
                *) OTHER+=("${f}") ;;
              esac
            done

            if [ "${#OTHER[@]}" -gt 0 ]; then
              echo "以下非 _worker.js 文件存在真实冲突，停止同步、不推送："
              printf '  - %s\n' "${OTHER[@]}"
              git merge --abort || true
              exit 1
            fi

            echo "_worker.js 文本冲突是预期行为，将丢弃 Git 混合结果。"
          else
            echo "仓库级合并无冲突。仍然不信任 Git 对 _worker.js 的自动混合。"
          fi

          echo "以上游 _worker.js 为底，叠加本地功能..."
          git show upstream/main:_worker.js > _worker.js
          node scripts/overlay-local-worker.js _worker.js
          node --check _worker.js
          git add -- _worker.js

          # 避免 overlay 脚本本身在合并中被改乱
          if git diff --name-only --diff-filter=U | grep -q 'overlay-local-worker.js'; then
            git checkout --ours -- scripts/overlay-local-worker.js
            git add -- scripts/overlay-local-worker.js
          fi

          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit -m "sync: merge cmliu/edgetunnel and overlay local _worker.js features"
          else
            git commit -m "sync: overlay local _worker.js features onto upstream"
          fi

          echo "上游同步 + 本地功能叠加完成。"

      - name: Validate merge result
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "工作区不干净，禁止推送："
            git status
            exit 1
          fi
          if git ls-files -u | grep -q .; then
            echo "仍存在未解决冲突，禁止推送。"
            exit 1
          fi
          node --check _worker.js
          grep -q 'LOCAL-CUSTOM: random-proxyip' _worker.js
          echo "合并结果验证通过。"

      - name: Final safety check before push
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          git fetch --prune origin main
          CURRENT_ORIGIN="$(git rev-parse origin/main)"
          echo "本次同步基准 main: ${BASE_SHA}"
          echo "当前 origin/main:  ${CURRENT_ORIGIN}"
          if [ "${BASE_SHA}" != "${CURRENT_ORIGIN}" ]; then
            echo "main 在合并期间发生变化，停止以免覆盖新提交。"
            exit 1
          fi

      - name: Push main
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main
          echo "同步完成：main 已更新（_worker.js = 上游 + 本地多IP随机）。"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Upstream sync"
            echo "- conclusion: \`${{ job.status }}\`"
            echo "- HEAD: \`$(git rev-parse HEAD 2>/dev/null || echo n/a)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-failure
          if-no-files-found: ignore
          path: |
            _worker.js
            scripts/overlay-local-worker.js
