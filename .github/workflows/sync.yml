name: Upstream Sync

# 只同步到 main，不创建任何临时分支。
# 无冲突：自动合并并推送到 main。
# 有冲突：立即停止，不推送，不破坏现有 main。

permissions:
  contents: write

on:
  schedule:
    # 每天 00:00 UTC 执行（北京时间/台北时间 08:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync cmliu/edgetunnel -> main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch --prune upstream main

      - name: Check whether upstream has new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "当前 main 已包含上游最新提交，无需同步。"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "检测到上游存在新提交，开始合并。"
          fi

      - name: Merge upstream into main
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          set -e

          echo "当前 main:    $(git rev-parse HEAD)"
          echo "上游 main:    $(git rev-parse upstream/main)"

          if git merge --no-edit upstream/main; then
            echo "上游更新已成功合并到 main。"
          else
            echo ""
            echo "========================================"
            echo "上游同步发生冲突。"
            echo "不会推送任何内容，现有 main 保持不变。"
            echo "请手动解决冲突后再次运行本工作流。"
            echo "========================================"
            git merge --abort || true
            exit 1
          fi

      - name: Push main
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          git push origin main
          echo "同步完成：CM-JieDian/main 已更新。"
